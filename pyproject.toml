[project]
name = "transit-ridership-analytics"
version = "0.1.0"
description = "Transit Ridership in California"
readme = "README.md"
requires-python = ">=3.11.0, <3.12.0"
# click<8.3: click 8.3 added strict flag validation that's incompatible with
# typer's boolean-flag generation. See cal-itp/data-analyses#2044.
dependencies = [
    "altair>=6.0.0",
    "altair-transform>=0.2.0",
    "branca>=0.8.2",
    "click<8.3",
    "geopandas>=0.14.0,<0.15.0",
    "gcsfs>=2026.4.0",
    "great-tables>=0.22.0",
    "gt-extras>=0.0.8",
    "intake>=2.0.9",
    "intake-geopandas>=0.3.0",
    "ipython==9.6.0",
    "itables>=2.7.3",
    "jinja2>=3.1.3,<4.0.0",
    "loguru>=0.6.0",
    "mapclassify>=2.8.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pandas-gbq==0.35",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.5",
    "polars>=1.40.1",
    "pyaml==21.10.1", # had "pyaml>=26.2.1"
    "quarto==0.1.0",
    "quarto-cli>=1.9.37",
	"ridership-utils",
    "shapely>=2.0.1,<3.0.0",
    "vegafusion==2.0.3",
    "vl-convert-python>=1.6.0",
]

[tool.uv.workspace]
members = [
    "_ridership_utils",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "black==24.10.0",
    "isort==5.10.1",
    "pre-commit>=2.18.1",
	"pyproject-local-kernel",
]


[tool.uv.sources]
ridership-utils = { workspace = true }
